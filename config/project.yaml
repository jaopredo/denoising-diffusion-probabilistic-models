experiment:
  name: ddpm_cifar10            # nome da execução; vira o nome da pasta e aparece nos logs
  seed: 42                      # fixa a aleatoriedade para você conseguir repetir o resultado
  output_dir: runs/ddpm_cifar10 # onde salvar checkpoints, amostras e uma cópia deste arquivo

data:
  root: ./data                  # pasta onde o dataset é baixado e guardado
  download: true                # baixar o dataset se não estiver na pasta root
  num_workers: 4                # processos carregando dados em paralelo, para a GPU não esperar

diffusion:
  T: 1000                       # número de passos de ruído; passos pequenos mantêm o reverso gaussiano
  beta_schedule: linear         # forma do cronograma de ruído; deixa testar o cosseno depois
  beta_start: 1.0e-4            # ruído no primeiro passo (muito pequeno, para destruir pouco no início)
  beta_end: 0.02                # ruído no último passo (ainda pequeno, para manter cada passo suave)
  sigma_type: beta              # variância do reverso: beta usa a do forward, beta_tilde usa a do
                                # posterior; permite reproduzir essa comparação do artigo
  predict: epsilon              # o que a rede prevê: o ruído (padrão do artigo), a média ou o x0;
                                # permite reproduzir a ablação da Seção 4

model:
  base_channels: 128            # largura da U-Net; controla o tamanho do modelo e o custo
  channel_mult: [1, 2, 2, 2]    # como a largura cresce a cada resolução da U-Net
  num_res_blocks: 2             # blocos residuais por resolução; mais blocos, mais capacidade
  attention_resolutions: [16]   # em quais resoluções usar atenção (cara, então só em algumas)
  dropout: 0.1                  # regularização, para o modelo não decorar o conjunto de treino
  time_embed_dim: 512           # tamanho do vetor que representa o passo t; a rede precisa saber o t

training:
  batch_size: 128               # imagens por passo de gradiente; reduza se faltar memória
  shuffle: true                 # embaralhar o dataset a cada época; ajuda a generalizar
  lr: 2.0e-4                    # taxa de aprendizado do otimizador
  grad_clip: 1.0                # limita o tamanho do gradiente, evitando explosões e treino instável
  num_steps: 800000             # total de passos de treino; reduza muito nos testes iniciais
  ema_decay: 0.9999             # média móvel dos pesos; amostrar com ela dá imagens bem melhores
  mixed_precision: false        # usar meia precisão acelera, mas pode desestabilizar; comece desligado

logging:
  log_every: 100                # a cada quantos passos registrar a loss
  sample_every: 5000            # a cada quantos passos gerar imagens; a loss quase não diz se
                                # o modelo está funcionando, olhar as amostras diz
  num_samples: 64               # quantas imagens gerar em cada inspeção visual
  checkpoint_every: 10000       # a cada quantos passos salvar o modelo, para não perder o treino
  resume_from: null             # caminho de um checkpoint para continuar um treino interrompido

sampling:
  num_samples: 64               # quantas imagens gerar na amostragem final
  use_ema: true                 # amostrar com os pesos suavizados (EMA), e não os pesos crus